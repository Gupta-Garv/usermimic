  <line x1="82" y1="50" x2="90" y2="50" stroke="#E1E0CC" stroke-width="3.2" stroke-linecap="square"/>
  <line x1="82" y1="58" x2="84" y2="58" stroke="#E1E0CC" stroke-width="3.2" stroke-linecap="square"/>

  <!-- Left Column Stem -->
  <path d="M 28 28 V 70 H 38 V 28" stroke="#E1E0CC" stroke-width="3.2" stroke-linecap="square" stroke-linejoin="miter"/>

