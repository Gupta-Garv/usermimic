  <path d="M 66 18 H 84 V 34" stroke="#E1E0CC" stroke-width="3.2" stroke-linecap="square" stroke-linejoin="miter"/>
  <path d="M 84 66 V 82 H 66" stroke="#E1E0CC" stroke-width="3.2" stroke-linecap="square" stroke-linejoin="miter"/>
  <path d="M 34 82 H 16 V 66" stroke="#E1E0CC" stroke-width="3.2" stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- Reticle Ticks Left -->
  <line x1="16" y1="42" x2="18" y2="42" stroke="#E1E0CC" stroke-width="3.2" stroke-linecap="square"/>
  <line x1="10" y1="50" x2="18" y2="50" stroke="#E1E0CC" stroke-width="3.2" stroke-linecap="square"/>
  <line x1="16" y1="58" x2="18" y2="58" stroke="#E1E0CC" stroke-width="3.2" stroke-linecap="square"/>

