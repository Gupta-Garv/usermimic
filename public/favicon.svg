<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Matte Dark Obsidian Background -->
  <rect width="100" height="100" rx="22" fill="#0A0A0C"/>
  <rect width="100" height="100" rx="22" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Viewfinder Corner Brackets -->
  <path d="M 22 36 V 22 H 36" stroke="#E1E0CC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 64 22 H 78 V 36" stroke="#E1E0CC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 78 64 V 78 H 64" stroke="#E1E0CC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 36 78 H 22 V 64" stroke="#E1E0CC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Outer Shutter Lens Ring -->
  <circle cx="50" cy="50" r="17" stroke="#E1E0CC" stroke-width="1.8" stroke-opacity="0.8"/>

  <!-- Precision Optical Aperture Blades -->
  <g stroke="#E1E0CC" stroke-width="1.5" stroke-linecap="round" opacity="0.85">
    <path d="M 50 33 C 57 36 63 43 62 50"/>
    <path d="M 64.7 41.5 C 68 49 66 57 59 62"/>
    <path d="M 64.7 58.5 C 61 66 52 68 45 65"/>
    <path d="M 50 67 C 43 64 37 57 38 50"/>
    <path d="M 35.3 58.5 C 32 51 34 43 41 38"/>
    <path d="M 35.3 41.5 C 39 34 48 32 55 35"/>
  </g>

  <!-- Glowing Amber Focal Sensor Core -->
  <circle cx="50" cy="50" r="6" fill="#D89C56" fill-opacity="0.25"/>
  <circle cx="50" cy="50" r="3.2" fill="#D89C56"/>
  <circle cx="50" cy="50" r="1.1" fill="#FFF5EA"/>
</svg>
